[package]
name = "nowplaying"
version = "0.2.1"
edition = "2024"
description = "Now-playing overlay for OBS (Apple Music / Spotify) on Windows"
license = "MIT"
repository = "https://github.com/S7nco/nowplaying"

[dependencies]
arboard = "3.7.0"
axum = { version = "0.8.9", features = ["ws"] }
open = "5.4.5"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tray-icon = "0.26.1"
wasapi = "0.26.0"
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", ] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true