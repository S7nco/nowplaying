name: Release

# Runs when a version tag is pushed, e.g.:
#   git tag v0.1.2
#   git push origin v0.1.2
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match Cargo.toml version $v" }

      - name: Check the release notes exist
        shell: pwsh
        run: |
          $notes = "release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) { throw "Missing $notes. Write the release notes and commit them before tagging." }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the tests
        shell: pwsh
        run: cargo test --locked

      - name: Check dependencies for known security problems
        shell: pwsh
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Build and package
        shell: pwsh
        run: ./package.ps1

      - name: Name the zip after the version
        shell: pwsh
        run: Rename-Item dist/NowPlaying.zip "NowPlaying-${{ github.ref_name }}.zip"
      
      - name: Checksum for the zip
        shell: pwsh
        run: |
          $name = "NowPlaying-${{ github.ref_name }}.zip"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "dist/$name.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/NowPlaying-${{ github.ref_name }}.zip
            dist/NowPlaying-${{ github.ref_name }}.zip.sha256
          body_path: release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
